plugins {
    id "com.android.application"
}

def targetAbi = project.findProperty("targetAbi") ?: "arm64-v8a"
def runtimeAar = rootProject.layout.buildDirectory.file("python-runtime/library-python3.14.8-${targetAbi}.aar")
def progressTestAssets = layout.buildDirectory.dir("generated/progress-test-assets")
def generateProgressTestTls = tasks.register("generateProgressTestTls") {
    outputs.dir(progressTestAssets)
    doLast {
        def folder = progressTestAssets.get().asFile
        folder.mkdirs()
        def keytool = new File(System.getProperty("java.home"), "bin/keytool" + (System.getProperty("os.name").startsWith("Windows") ? ".exe" : ""))
        def store = new File(folder, "fixture.p12")
        // Isolated generated test credentials; never packaged in the production APK or committed.
        if (!store.exists()) {
            exec { commandLine keytool, "-genkeypair", "-alias", "fixture", "-keyalg", "RSA",
                    "-keysize", "2048", "-validity", "365", "-dname", "CN=localhost",
                    "-ext", "SAN=ip:127.0.0.1", "-ext", "bc=ca:true", "-keystore", store,
                    "-storetype", "PKCS12", "-storepass", "synthetic-test-only", "-noprompt" }
        }
        exec { commandLine keytool, "-exportcert", "-rfc", "-alias", "fixture", "-keystore", store,
                "-storepass", "synthetic-test-only", "-file", new File(folder, "fixture-ca.pem") }
    }
}

configurations {
    pythonRuntimeBase { transitive = false }
}

def preparePythonRuntime = tasks.register("preparePythonRuntime", Exec) {
    inputs.file(rootProject.file("tools/prepare_python_runtime.py"))
    inputs.file(rootProject.file("tools/python-launcher.c"))
    inputs.file(rootProject.file("tools/prepare_curl_transport.py"))
    inputs.files(configurations.pythonRuntimeBase)
    inputs.property("abi", targetAbi)
    outputs.file(runtimeAar)
    doFirst {
        def python = project.findProperty("runtimePython") ?: "python"
        commandLine python, rootProject.file("tools/prepare_python_runtime.py"), "--abi", targetAbi,
                "--base", configurations.pythonRuntimeBase.singleFile, "--output", runtimeAar.get().asFile
    }
}

android {
    sourceSets { androidTest { assets.srcDir(progressTestAssets) } }
    namespace "com.local.ytdown"
    compileSdk 36

    defaultConfig {
        applicationId "com.local.ytdown"
        minSdk 24
        targetSdk 36
        versionCode 68
        versionName "1.9.29"
        testInstrumentationRunner "com.local.ytdown.StreamProgressInstrumentation"

        ndk {
            abiFilters targetAbi
        }
    }

    buildTypes {
        release {
            debuggable false
            // Compatibility delivery uses the installed key; storeRelease requires a production key.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            // Retain upstream license/notice text; merge duplicate resource paths.
            excludes += ["META-INF/DEPENDENCIES"]
            merges += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach {
    if (name in ["mergeDebugAndroidTestAssets", "lintAnalyzeDebugAndroidTest",
                 "generateDebugAndroidTestLintModel"]) dependsOn(generateProgressTestTls)
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.webkit:webkit:1.17.0"
    pythonRuntimeBase "io.github.junkfood02.youtubedl-android:library:0.18.1@aar"
    implementation files(runtimeAar).builtBy(preparePythonRuntime)
    // Preserve the upstream AAR's published dependencies after local Python-only repackaging.
    implementation "io.github.junkfood02.youtubedl-android:common:0.18.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.22"
    implementation "androidx.appcompat:appcompat:1.4.2"
    implementation "androidx.core:core-ktx:1.8.0"
    implementation enforcedPlatform("com.fasterxml.jackson:jackson-bom:2.22.4")
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "commons-io:commons-io:2.22.0"
    implementation "org.apache.commons:commons-compress:1.28.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}

apply from: rootProject.file("gradle/store-release.gradle")
apply from: rootProject.file("gradle/security-inventory.gradle")
